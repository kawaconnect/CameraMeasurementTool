[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "camera-wire-tool"
version = "1.2.4"
description = "Tkinter desktop tool for security-camera wire estimation on draw.io floor plans"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Dean Thomas" }]
dependencies = [
    "Pillow>=10.0",
    "sv-ttk>=2.6",
    "reportlab>=4.0",   # PDF export; bundled into the exe/AppImage
    "defusedxml>=0.7",  # safe parsing of .drawio files from other people
]

[project.optional-dependencies]
# DXF / SVG floor-plan import. Optional, the app runs without these and
# only needs them when a user opens a .dxf or .svg drawing.
cad = [
    "ezdxf>=1.1",       # DXF parsing
    "matplotlib>=3.7",  # DXF rendering backend for ezdxf
    "pymupdf>=1.23",    # SVG rasterization
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.5",
    "mypy>=1.10",
    "reportlab>=4.0",
    "ezdxf>=1.1",
    "matplotlib>=3.7",
    "pymupdf>=1.23",
]

[project.scripts]
camera-wire-tool = "camera_wire_tool:main"

# The app is one module plus the cwt package; name them so setuptools does
# not try to guess from the other top-level folders (tests, packaging, old).
[tool.setuptools]
py-modules = ["camera_wire_tool"]
packages = ["cwt"]

[tool.ruff]
line-length = 110
target-version = "py310"
# old/ is the earlier PNG-only tool, kept for reference and not maintained.
extend-exclude = ["old"]

[tool.ruff.lint]
# Rules that catch real bugs, not style: syntax errors (E9), pyflakes (F:
# undefined names, unused imports/variables, broken f-strings), bugbear (B)
# and pylint errors (PLE). CI runs `ruff check .` with exactly this set. The
# main module is not reformatted, so no pycodestyle/isort/pyupgrade rules.
select = ["E9", "F", "B", "PLE"]
ignore = [
    "B905",  # zip() without strict=: lengths are checked where it matters
]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true
strict_optional = true
# Not part of CI yet (`mypy cwt/` still reports errors). UI code is hard to
# type fully; only the pure-math modules require typed definitions.
[[tool.mypy.overrides]]
module = ["cwt.bom", "cwt.fov"]
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q --tb=short"
